services:
  - type: web
    name: velocinder-labs
    runtime: static
    buildCommand: node build.cjs
    staticPublishPath: dist
    envVars:
      - key: RELEASE_BASE_URL
        value: https://github.com/ajwilder22/velocinder-website/releases/download/v1.0.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /downloads/*
        name: Content-Disposition
        value: attachment
      - path: /release.json
        name: Cache-Control
        value: no-cache

